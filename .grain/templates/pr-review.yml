# The general code review every grain-opened pull request on this
# repository gets, filed by .grain/triggers/every-pr.yml (one review per
# pull request head, re-reading only what a later push changed). It posts
# findings and fixes nothing. grain appends the subject of the review and
# its own findings-only and testing rules to this body. Adapted from
# ai-on-gke/grain's .grain/templates/pr-review.yml.
#
# No `network:` key, so the deployment's default applies. `none` would
# fail setup on any host that cannot isolate a sandbox's network, and it
# would also block the module downloads that a targeted `go test -run`
# needs.
name: PR review
title: "Review {{pr}}"
body: |
  Review the change in this pull request the way a careful senior
  maintainer of silo would, and post what needs fixing. Read the diff
  (`git diff {{base_sha}}...HEAD` or the pull request's file list) and as
  much of the surrounding code as you need to judge it. Do not review the
  whole repository.

  This repository holds three Go modules, and a change usually belongs
  to one of them (README.md, "Layout"):

  - the root module, `github.com/bwsalmon/silo`: Grain Hub (`hub/`,
    `cmd/silo`, `internal/`, `events/`, `ui/`, `sdk/`, `deploy/`);
  - `v3/`, the module `github.com/bwsalmon/silo/v3` (v3/README.md);
  - `v4/`, the module `github.com/bwsalmon/silo/v4`, with its design
    and normative spec under `v4/docs/`.

  `old/` is retired code in a module of its own that nothing builds on a
  push or pull request.

  ## What to check

  - **Correctness and edge cases.** Bugs, off-by-ones, nil and empty
    inputs, races and missing locking, leaked goroutines, connections or
    streams, errors dropped, swallowed or wrapped without context, and
    behaviour on retry, reconnect, restart or a partial failure -- for
    the hub, a node dropping its tunnel mid-stream or a pod restarting
    while it holds a lease.
  - **Tests.** The change has a test, and the test really exercises the
    new behaviour: it would fail without the change, and it does not
    just assert on a fake it set up itself. Flag flaky patterns such as
    `time.Sleep` used for ordering, shared package-level state without
    `t.Cleanup`, port or timing assumptions, and order-dependent
    subtests. A hub store test runs against SQLite and against
    PostgreSQL through `internal/pgtest` (skipped without PostgreSQL's
    binaries unless `SILO_REQUIRE_POSTGRES=1`), and the stores the
    `spanner` job runs must stay Spanner-compatible: flag SQL that only
    one of them accepts. A security test cites the `INV-` it checks.
  - **Security.** Credentials, node tokens, session cookies and OIDC or
    IAP assertions are not logged, put in error messages, or written
    into prompts, events or tasks. A string someone else chose is logged
    through `internal/logsafe` (`logsafe.Quote`, INV-18). Inputs that
    cross a trust boundary (docs/threat-model.md, `TB-`) are validated
    and authorized by the caller's identity and team, not by what the
    request claims. If the change touches a trust-boundary path
    (`.grain/triggers/hub-trust-boundary.yml`, `hub-deploy.yml`,
    `hub-contract-docs.yml`), grain's security review is already
    reviewing that head, so do not repeat its deep review. Flag only
    what you notice in passing.
  - **Compatibility.** The node interface (docs/hub-interface.md, the
    `silo-node.v1` subprotocol, the `events/` schema), the hub's HTTP
    API, the `silo` CLI and its `SILO_HUB_*` settings, and the database
    schema: a field renamed or removed, a default changed, a migration
    `silo hub migrate` cannot apply over the existing tables. Docs have
    to change with the behaviour they describe: docs/hub-interface.md
    with the node interface, docs/threat-model.md with any change that
    moves a boundary (in the same pull request), README.md and docs/ with
    the layout and CLI, and `v4/docs/spec` with v4's normative
    behaviour. Commit subjects follow the repository's
    conventional-commit style, scoped to what they change (`feat(v4):`,
    `fix(hub):`, `docs(v4):`).

  ## Keep the review cheap

  - Do not run broad or full test suites: no `go test ./...` in any of
    the three modules, no `-race` across packages, and not the
    `grain-interop` script, the conformance run, the UI's `npm test` or
    the deploy validation. Do not run `grain ci wait` or
    `wait_for_checks` either. The change's own grain CI run is the test
    signal, so read its result with `grain pr open` or the check
    statuses instead of waiting on it or running it again.
  - At most, run one narrowly targeted test (`go test ./hub/<pkg> -run
    <Name>`, or `cd v3 && go test ./<pkg> -run <Name>`, likewise for
    `v4`) when you need it to confirm or refute a specific finding, and
    say in your closing note which test you ran and why.
  - Do not push, commit or open a pull request. Findings go on the pull
    request and the task.

  ## Reporting

  - Record each real problem with `add_review_comment`, on the line it
    is about, saying what is wrong and the fix you recommend.
  - Do not comment on formatting or style that `gofmt`, `go vet`,
    prettier or the repository's linters (`tools/grainfiles/grainlint.py`
    for Grainfiles) already enforce. Do not post nitpicks or matters of
    taste either.
  - If nothing needs fixing, call no `add_review_comment` and finish
    with `comment_on_issue` saying plainly "No findings", with a line on
    what you checked. A review with no findings is what lets the change
    merge itself.
