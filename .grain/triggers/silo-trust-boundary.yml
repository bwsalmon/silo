# silo's trust boundary: what decides whether the agent's proposals take
# effect (the approval prompt and the terminal it reads from), which tools
# the agent CLI gets and which of its own are turned off (the adapters),
# what the router lets through, what a tool set's child process runs with
# (router/host.go), what repo-read and repo-write let a path reach, where
# an approved commit is pushed and which tool sets config turns off
# (gitrepo, config), the MCP protocol layer every call passes through
# (mcp), the audit log every call and approval is recorded in (audit),
# the module's third-party dependencies (go.mod, go.sum), and the entry
# point that wires these together (cmd/silo).
#
# `sensitive: true` files grain's security review on every pull request
# that touches these paths and withdraws its auto-merge. `human:
# on-findings` releases it once the review finishes with no findings;
# only a review that finds something waits for a human.
on: pull_request
paths:
  - internal/approval/**
  - internal/adapter/**
  - internal/router/**
  - internal/builtin/**
  - internal/session/**
  - internal/gitrepo/**
  - internal/config/**
  - internal/mcp/**
  - internal/audit/**
  - go.mod
  - go.sum
  - cmd/silo/**
gate: true
human: on-findings
sensitive: true
