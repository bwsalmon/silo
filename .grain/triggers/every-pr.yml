# Path trigger giving every grain-opened pull request on this repository
# a general code review (.grain/templates/pr-review.yml), copied from
# ai-on-gke/grain's own .grain/triggers/every-pr.yml.
#
# This is a gating trigger rather than a `.grain/review.yml` default
# review. A default review is attached to a task and filed once, as a
# stacked review told to push fixes; a gating trigger's review is one per
# pull request head and review template, posts findings without pushing,
# and after a push re-reads only the new commits, debounced
# (ai-on-gke/grain docs/declarations.md, "Gating reviews"). Do not add a
# .grain/review.yml beside this file, or every task would be reviewed
# twice.
#
# Gating, with human: on-findings: a clean review gives the change its
# auto-merge back, and findings hold the merge as questions to the
# change's owner. Review tasks and tasks a trigger filed are never
# judged, so a review of a review is never filed. The other triggers
# here (grain-declarations, hub-contract-docs, hub-deploy,
# hub-trust-boundary) are sensitive ones, which file grain's security
# review, a review kind of its own: they still apply beside this one, and
# grain-declarations still waits for a human on any change to .grain/.
on: pull_request
paths: ["**"]
template: pr-review
gate: true
human: on-findings
auto-approve: true
