# The hub's CI, run by grain (.grain/workflows) when dispatched by hand
# (see below): it formats, builds, vets and race-tests the root module,
# github.com/bwsalmon/silo (README.md). The root module's ./... stops at
# old/go.mod, so the retired runner in old/ is not built here
# (.grain/workflows/old.yml tests it, only when run by hand).
name: hub

# v2: manual only (workflow_dispatch, e.g. `grain ci run`), so it is not
# in the merge gate. The default CI is v3.yml.
on:
  workflow_dispatch:

env:
  # Deliberately not -mod=mod: a sandbox that cannot reach the network
  # should fail saying the module is missing rather than hanging on a
  # proxy it will never reach.
  GOFLAGS: -mod=readonly
  # The sandboxes' Go may be older than go.mod's toolchain line, which
  # GOTOOLCHAIN=local would ignore: build, test and scan with the Go the
  # hub ships with (SA1-L4).
  GOTOOLCHAIN: auto

jobs:
  hub:
    name: hub
    # The retired runner and the documentation, which no hub test reads.
    paths-ignore:
      - old/**
      - docs/**
      - "*.md"
    sandbox:
      cpus: 4
      memory-mb: 8192
    timeout-minutes: 20
    steps:
      # hub/directory runs its store tests against PostgreSQL as well as
      # SQLite; internal/pgtest starts a throwaway server from these
      # binaries.
      - name: Install PostgreSQL
        infrastructure: true
        run: |
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            if [ ! -e /usr/sbin/policy-rc.d ]; then
              printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
              sudo chmod +x /usr/sbin/policy-rc.d
            fi
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql >/dev/null
          fi
          ls /usr/lib/postgresql/*/bin/initdb

      # gofmt walks directories without regard to modules, so it is
      # given only the hub module's own directories.
      - name: Format
        run: |
          unformatted="$(gofmt -l cmd hub internal events)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Known vulnerabilities reachable from the hub, in its modules and
      # in the standard library of the Go it is built with.
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Test
        env:
          SILO_REQUIRE_POSTGRES: "1"
        run: go test -race -timeout 15m ./...

      # The conformance kit (docs/conformance.md), from the command
      # line, against the reference Grain: what someone checking their
      # own Grain runs. hub/conformance's tests drive the same kit.
      - name: Conformance
        run: |
          go build -o /tmp/silo ./cmd/silo
          /tmp/silo conformance -json /tmp/conformance.json -- /tmp/silo conformance grain

  # The stores that run on Cloud Spanner's PostgreSQL dialect, against
  # Spanner's emulator behind PGAdapter (docs/spanner-evaluation.md), so
  # they stay Spanner-compatible. hub/notify and hub/server are not run:
  # Spanner has no LISTEN/NOTIFY or advisory locks, which the bus and
  # the dispatcher's lease are, and their tests skip or fail there.
  spanner:
    name: spanner
    paths-ignore:
      - old/**
      - docs/**
      - "*.md"
    sandbox:
      cpus: 4
      memory-mb: 8192
    timeout-minutes: 20
    steps:
      # One container runs both the emulator and PGAdapter, which creates
      # each database a test connects to (autoConfigEmulator). No GCP
      # project or credential is involved.
      - name: Start the Spanner emulator and PGAdapter
        infrastructure: true
        run: |
          docker run -d --name spanner-pg -p 127.0.0.1:5433:5432 -p 127.0.0.1:9020:9020 gcr.io/cloud-spanner-pg-adapter/pgadapter-emulator
          for i in $(seq 60); do
            docker logs spanner-pg 2>&1 | grep -q "Server started on port 5432" && exit 0
            sleep 1
          done
          docker logs spanner-pg
          exit 1

      - name: Test
        env:
          SILO_TEST_SPANNER: "127.0.0.1:5433"
        run: go test -count=1 -timeout 10m ./hub/directory ./hub/tasks ./hub/registry ./hub/lease ./hub/grainfiles
