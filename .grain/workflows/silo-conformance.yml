# The silo/v1 conformance suite against real GCP (docs/silo/testing.md,
# "Conformance suite", SV-121): silo install into a fresh
# --address-space in bsalmon-fun-sandbox, the cases, then silo uninstall
# --force --delete-data --yes and a check that nothing labelled is left.
#
# Nightly and by hand, never on a pull request: a run creates a Cloud SQL
# instance and VMs, and takes tens of minutes. It needs the gcp-key
# capability. A scheduled run gets it only if this deployment's CI
# capabilities grant gcp-key to schedules, which is grain/config's to
# change, not this repository's; until then the scheduled run fails in
# its first step saying so, rather than going green over nothing.
#
# Each case is a Go test or subtest, and go test -v prints one
# "--- PASS/FAIL/SKIP: <name>" line per case, which grain's test history
# keeps a pass rate for.
name: silo-conformance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

env:
  GOFLAGS: -mod=readonly

jobs:
  conformance:
    name: conformance
    capabilities: [gcp-key]
    sandbox:
      cpus: 4
      memory-mb: 8192
    timeout-minutes: 180
    steps:
      - name: Check the GCP key
        run: |
          key=/home/debian/.gcp-service-account.json
          if [ ! -s "$key" ]; then
            echo "::error::no GCP key at $key: this job needs the gcp-key capability."
            echo "A scheduled run gets gcp-key only if the deployment's CI capabilities grant it to"
            echo "schedules, which is a change to grain/config, not to this repository."
            exit 1
          fi
          gcloud auth activate-service-account --key-file="$key"
          gcloud config set project bsalmon-fun-sandbox

      # The suite uninstalls at the end of TestMain. The trap uninstalls
      # again for a run that dies before it gets there (a panic, the
      # timeout), so a failed run still leaves nothing behind.
      - name: Conformance
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/debian/.gcp-service-account.json
          GOOGLE_CLOUD_PROJECT: bsalmon-fun-sandbox
        run: |
          set -o pipefail
          go build -o /tmp/silo ./cmd/silo
          trap '/tmp/silo uninstall --project bsalmon-fun-sandbox --credentials "$GOOGLE_APPLICATION_CREDENTIALS" --force --delete-data --yes || true' EXIT
          go test -tags silo_conformance -count=1 -timeout 160m -v ./pkg/conformance/ 2>&1 | tee /tmp/conformance.log
          status=$?
          echo "=== cases ==="
          grep -E -- '--- (PASS|FAIL|SKIP)' /tmp/conformance.log
          exit $status
