# The hub's web UI (ui/, docs/ui.md), run by grain on every push and
# pull request: the frontend is type-checked, built into
# hub/ui/static/app, and unit-tested with vitest, the trust-boundary
# tests among them (no service worker, no storage, the view-through
# uncached); then hub/ui and hub/server are tested with that bundle
# embedded, as the hub's image carries it. The bundle is never
# committed; hub.yml's Go build embeds the placeholder in its place.
name: ui

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: auto
  # hub/ui's and the vitest suite's bundle tests fail, rather than skip,
  # without one.
  SILO_UI_REQUIRE_BUNDLE: "1"

jobs:
  ui:
    name: ui
    paths-ignore:
      - old/**
      - docs/**
      - "*.md"
    timeout-minutes: 15
    steps:
      - name: Check Node
        infrastructure: true
        run: |
          node --version
          npm --version

      - name: Install
        run: cd ui && npm ci --no-audit --no-fund

      - name: Type-check and build
        run: cd ui && npm run build

      - name: Test
        run: cd ui && npm test

      - name: Embed
        run: go test ./hub/ui ./hub/server -run 'TestBundle|TestHandler|TestPlaceholder|TestWebUI'

  # The TypeScript client SDK the UI is built on (sdk/ts, docs/ui.md
  # §11): type-checked, built as the package would be, unit-tested with
  # vitest (its routes among them: each is one docs/hub.md documents),
  # then run in Node against a real `silo hub serve` and a fake Grain
  # built from this tree (including live Grainfile discovery, filtering,
  # overview inspection, and node recipient subscription reporting).
  sdk:
    name: sdk
    paths-ignore:
      - old/**
      - "*.md"
    timeout-minutes: 15
    steps:
      - name: Check Node and Go
        infrastructure: true
        run: |
          node --version
          go version

      - name: Install
        run: cd sdk/ts && npm ci --no-audit --no-fund

      - name: Type-check and build
        run: cd sdk/ts && npm run typecheck && npm run build

      - name: Test
        run: cd sdk/ts && npm test

      - name: Integration
        run: cd sdk/ts && npm run test:integration

  # The browser suite (ui/e2e, ui/playwright.config.ts): Chromium driven
  # by Playwright against `silo hub serve` with this bundle embedded,
  # and scripted fake Grains (internal/fakegrain) on the real
  # rendezvous. It runs on every push rather than nightly: the whole
  # suite is well under a minute of tests after a two-minute build, each
  # test makes its own team, users and nodes, and the fakes emit events
  # only when a spec tells them to, so nothing in it waits on a clock it
  # could flake against. A failed test's trace and screenshot are kept
  # under ui/test-results.
  ui-e2e:
    name: ui e2e
    paths-ignore:
      - old/**
      - docs/**
      - "*.md"
    sandbox:
      cpus: 4
      memory-mb: 8192
    timeout-minutes: 20
    artifacts:
      - name: playwright-test-results
        path: ui/test-results
    steps:
      - name: Check Node and Go
        infrastructure: true
        run: |
          node --version
          go version

      - name: Install
        run: cd ui && npm ci --no-audit --no-fund

      # The browser and the system libraries it needs are downloads, not
      # a verdict on this commit.
      - name: Download Chromium
        infrastructure: true
        run: cd ui && NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt npx playwright install --with-deps chromium

      - name: Build
        run: cd ui && npm run build && npm run e2e:typecheck

      - name: Test
        env:
          CI: "1"
        run: cd ui && npm run e2e
