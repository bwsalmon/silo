# Silo's CI, run by grain (.grain/workflows) on every push and pull
# request. The jobs are the two of grain's own tests.yml that covered
# Silo while it lived in grain's repository: `go`, which formats, builds,
# vets and race-tests the whole module, and `postgres`, which runs the
# store against a real PostgreSQL server. They are independent, so
# neither waits on the other.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  # Deliberately not -mod=mod: a sandbox that cannot reach the network
  # should fail saying the module is missing rather than hanging on a
  # proxy it will never reach.
  GOFLAGS: -mod=readonly

jobs:
  go:
    name: go
    # Everything but the documentation: no test opens anything under
    # docs/ or a top-level Markdown file.
    paths-ignore: &not-read-by-the-go-program
      - docs/**
      - "*.md"
    sandbox:
      cpus: 8
      memory-mb: 16384
    timeout-minutes: 60
    steps:
      - name: Format
        run: make fmt

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: |
          set +e
          go test -race -timeout 45m ./... > /tmp/gotest.log 2>&1
          status=$?
          set -e
          echo "=== failing tests ==="
          grep -n -A 30 -- '--- FAIL' /tmp/gotest.log | head -500
          echo "=== panics ==="
          grep -n -A 30 -- '^panic:' /tmp/gotest.log | head -200
          echo "=== data races ==="
          grep -n -A 30 -- '^WARNING: DATA RACE' /tmp/gotest.log | head -200
          echo "=== per-package results ==="
          grep -E '^(ok|FAIL|\?)[[:space:]]' /tmp/gotest.log | head -200
          echo "=== last 200 lines of the raw run ==="
          tail -n 200 /tmp/gotest.log
          exit $status

  # The rootless namespace holder, silo-nsd, on a real kernel as the
  # unprivileged runner user (docs/silo/local-backend.md §15, step 15):
  # first the spike, which proves with stock tools that the design's
  # namespaces, passed netlink sockets, runc and runsc work; then
  # pkg/backend/local/nsd's own tests, and pkg/backend/local/rootless's
  # (step 16: containerd in the holder, crun keeping the kvm group, runsc
  # inside a container's user namespace) and
  # pkg/backend/local/runtime/gvisor's (step 7: the sandbox class's driver
  # end to end, through silo-containerd and the runsc shim), which skip
  # in the `go` job (no newuidmap there) and are required here by
  # SILO_REQUIRE_NSD, and
  # pkg/backend/local/netfence's, which load the compiled fence with the
  # real nft, and pkg/registry/containerdstore's (local-registry.md step
  # 27b: the registry's content store over silo-containerd, rootless in
  # a holder, held to the contract the `go` job holds its fake to).
  nsd:
    name: nsd
    paths-ignore: *not-read-by-the-go-program
    sandbox:
      cpus: 4
      memory-mb: 8192
    timeout-minutes: 30
    steps:
      # A pinned gVisor release, checked against its published sha512.
      # containerd 2.x and ctr come with the runner image: Debian 12's own
      # containerd (1.6) can't read silod's version-3 configuration, and
      # its crun (1.8) is too old for containerd 2's specs, though not
      # for the specs the rootless tests run it on.
      - name: Install uidmap, nftables, runc, crun and runsc
        infrastructure: true
        run: |
          set -e
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq uidmap nftables iproute2 busybox-static python3 crun >/dev/null
          command -v runc >/dev/null || sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq runc >/dev/null
          runc --version
          crun --version | head -1
          containerd --version
          command -v ctr
          mkdir -p /tmp/gvisor && cd /tmp/gvisor
          curl -sfLO https://storage.googleapis.com/gvisor/releases/release/20261005/x86_64/gvisor.tar.bz2
          echo "79869ae9a589355a46d46fdac068d9a954e741741ffe77c64e38c56ea955498c1cb04e9bce44e1cce5155333e6b76bee72347c6661bb7c78fd2fe3aad198c8fe  gvisor.tar.bz2" | sha512sum -c -
          tar xjf gvisor.tar.bz2
          ./runsc --version
          grep "^$(id -un):" /etc/subuid /etc/subgid

      - name: Spike
        run: pkg/backend/local/nsd/testdata/spike.sh /tmp/gvisor/runsc

      - name: Test
        env:
          SILO_REQUIRE_NSD: "1"
          SILO_NSD_RUNSC: /tmp/gvisor/runsc
        run: go test -count=1 -timeout 15m ./pkg/backend/local/nsd/... ./pkg/backend/local/netfence/ ./pkg/backend/local/rootless/... ./pkg/backend/local/runtime/... ./pkg/registry/containerdstore/ ./cmd/silo/

  # The registry for local image repos (docs/silo/local-registry.md §13,
  # step 27) against real clients: the OCI distribution-spec
  # conformance suite, crane, skopeo and oras, each against the
  # registry in process on a loopback port. The `go` job skips these
  # cases, having none of the clients; SILO_REQUIRE_REGISTRY_CLIENTS
  # makes a missing one a failure here.
  registry:
    name: registry
    paths-ignore: *not-read-by-the-go-program
    sandbox:
      cpus: 4
      memory-mb: 8192
    timeout-minutes: 30
    steps:
      # Downloads, so `infrastructure:`. The suite, crane and oras are
      # pinned Go modules, built outside this module (GOFLAGS cleared:
      # -mod=readonly means nothing there); skopeo is Debian's.
      - name: Install the conformance suite, crane, skopeo and oras
        infrastructure: true
        env:
          GOFLAGS: ""
        run: |
          set -e
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq skopeo >/dev/null
          skopeo --version
          go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
          go install oras.land/oras/cmd/oras@v1.3.4
          tmp=$(mktemp -d) && cd "$tmp" && go mod init conformance-build >/dev/null 2>&1
          go get github.com/opencontainers/distribution-spec/conformance@v0.0.0-20260831232431-97274622c111
          cp -r "$(go list -m -f '{{.Dir}}' github.com/opencontainers/distribution-spec/conformance)" suite
          chmod -R u+w suite && cd suite && go test -c -o /tmp/oci-conformance.test .

      - name: Test
        env:
          SILO_REQUIRE_REGISTRY_CLIENTS: "1"
          SILO_OCI_CONFORMANCE: /tmp/oci-conformance.test
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go test -count=1 -timeout 10m -v -run 'TestDistributionSpec|TestCraneCLI|TestSkopeo|TestOras' ./pkg/registry/

  # The local backend's conformance (docs/silo/local-backend.md §13, "How
  # CI runs them", and "As built in step 12"), on every push: the
  # backend-neutral cases of pkg/conformance/fence (the fence's, behind
  # conformance.Target's Fence, and the registry's), the Docker
  # facade's of pkg/conformance/docker and the local-only structural
  # ones of pkg/conformance/local (repos and the mirror's among them,
  # with real git clients), against every conformance.Target.
  # "local/fake" runs them in process, judging probes' packets with the
  # nftables evaluator; "gcp" reports them not offered or not runnable
  # here (its own forms run nightly in silo-conformance); "local/sandbox"
  # and "local/vm" report themselves not runnable until silod serves the
  # registry and the Docker facade's host sockets, which this job needs
  # to install the local backend and make probe containers. The summary
  # at the end of Test names every target that wasn't tested, and
  # whether /dev/kvm works here for the vm class. The `go` job runs the
  # same packages, without the distribution-spec suite, which this job
  # requires.
  local-conformance:
    name: local-conformance
    paths-ignore: *not-read-by-the-go-program
    sandbox:
      cpus: 4
      memory-mb: 8192
    timeout-minutes: 30
    steps:
      # A download, so `infrastructure:`; the same pinned suite as the
      # registry job's.
      - name: Install the distribution-spec conformance suite
        infrastructure: true
        env:
          GOFLAGS: ""
        run: |
          set -e
          tmp=$(mktemp -d) && cd "$tmp" && go mod init conformance-build >/dev/null 2>&1
          go get github.com/opencontainers/distribution-spec/conformance@v0.0.0-20260831232431-97274622c111
          cp -r "$(go list -m -f '{{.Dir}}' github.com/opencontainers/distribution-spec/conformance)" suite
          chmod -R u+w suite && cd suite && go test -c -o /tmp/oci-conformance.test .

      - name: Test
        env:
          SILO_REQUIRE_REGISTRY_CLIENTS: "1"
          SILO_OCI_CONFORMANCE: /tmp/oci-conformance.test
        run: |
          set +e
          go test -count=1 -timeout 15m -v ./pkg/conformance/fence/ ./pkg/conformance/docker/ ./pkg/conformance/local/ > /tmp/conformance.log 2>&1
          status=$?
          cat /tmp/conformance.log
          set -e
          echo "=== targets not tested on this runner ==="
          grep -oE '(gcp|local/[a-z]+): not (runnable here|offered)[^"]*' /tmp/conformance.log | sort | uniq -c || true
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "/dev/kvm: usable here"
          else
            echo "/dev/kvm: not usable here; the vm class is not tested on this runner"
          fi
          exit $status

  # ./pkg/store/... is silod's store: the conformance suite, and the
  # Postgres-only lease and change-log cases, against a throwaway server
  # per test (pkg/internal/pgtest). SILO_REQUIRE_POSTGRES makes every
  # "postgres is not available" skip a failure instead, so a server that
  # does not come up is this job's red rather than a quiet `ok`. The `go`
  # job, which has no PostgreSQL, skips those cases.
  # docs/silo/state.md, "Testing the store".
  postgres:
    name: postgres
    paths-ignore: *not-read-by-the-go-program
    sandbox:
      cpus: 4
      memory-mb: 8192
    timeout-minutes: 30
    steps:
      # `infrastructure:` because this is a download: an archive that is
      # down errors the job instead of failing the commit. policy-rc.d
      # (the image's own, or one written here when it has none) keeps
      # the package's own cluster from starting -- the tests start
      # theirs on a free port and want nothing on 5432.
      - name: Install PostgreSQL
        infrastructure: true
        run: |
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            if [ ! -e /usr/sbin/policy-rc.d ]; then
              printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
              sudo chmod +x /usr/sbin/policy-rc.d
            fi
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql >/dev/null
          fi
          ls /usr/lib/postgresql/*/bin/initdb

      - name: Test
        env:
          SILO_REQUIRE_POSTGRES: "1"
        # The fence API's TestPostgres runs its cases on Postgres too.
        run: |
          set -e
          go test -count=1 -timeout 20m ./pkg/store/...
          go test -count=1 -timeout 10m -run TestPostgres ./pkg/fenceapi/
