# silo's CI, run by grain on every push and pull request: it formats,
# builds, vets and race-tests the module (cmd/silo and internal/...),
# including the end-to-end session test with a fake agent CLI.
#
# The file and job keep the name "v3" because the default branch's merge
# gate requires a job .grain/workflows/v3.yml:v3, and a branch cannot
# change its own gate. Rename both to "silo" in a follow-up change once
# this one has merged.
name: v3

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  # Deliberately not -mod=mod: a sandbox that cannot reach the network
  # should fail saying the module is missing rather than hanging on a
  # proxy it will never reach.
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: auto

jobs:
  v3:
    name: v3
    timeout-minutes: 15
    steps:
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -timeout 10m ./...
