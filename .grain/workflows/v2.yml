# Silo v2's CI (v2/README.md): v2/ is its own Go module,
# github.com/bwsalmon/silo/v2, which the root module's ./... never
# reaches, so tests.yml's jobs (v1's) do not test it and this job does
# not test v1. It formats, builds, vets and race-tests the v2 module,
# including the gateway's tests against real container and gVisor
# sandboxes and gitproxy's against real git clients (SILO_V2_REQUIRE_DOCKER,
# SILO_V2_REQUIRE_RUNSC and SILO_V2_REQUIRE_GIT make a missing Docker, runsc
# or git a failure here rather than a skip; location/ssh's tests run a
# real sshd in Docker, and location/k8s's a kind cluster in Docker, so
# SILO_V2_REQUIRE_DOCKER covers them too, and makes a missing kind or
# kubectl a failure). The granule sandbox kind's tests boot real granule
# microVMs (SILO_V2_REQUIRE_GRANULE): the job reads gke-labs/granule
# through the git proxy (repo-read, below), builds its CLI at a pinned
# commit, and pulls grain's published guest image and the images
# granule builds Granulefiles with.
name: v2

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  GOFLAGS: -mod=readonly

jobs:
  v2:
    name: v2
    # v1's files, which the v2 module does not read. Anything else -- v2/
    # itself, this workflow, a new top-level file -- runs the job.
    paths-ignore:
      - cmd/**
      - pkg/**
      - docs/**
      - go.mod
      - go.sum
      - Makefile
      - "*.md"
    sandbox:
      cpus: 2
      # location/k8s's tests run a kind cluster beside everything else.
      memory-mb: 8192
    # The granule CLI is built from source: grain's Go module proxy cannot
    # fetch github.com/gke-labs/granule, and silo drives the binary rather
    # than importing it (v2/sandbox/granule).
    capabilities: ["repo-read:gke-labs/granule"]
    timeout-minutes: 30
    steps:
      # A pinned gVisor release, checked against its published sha512 (the
      # same one tests.yml's nsd job installs), registered with Docker as
      # the runtime runsc for the gvisor sandbox kind.
      - name: Install runsc
        infrastructure: true
        run: |
          set -e
          mkdir -p /tmp/gvisor && cd /tmp/gvisor
          curl -sfLO https://storage.googleapis.com/gvisor/releases/release/20261005/x86_64/gvisor.tar.bz2
          echo "79869ae9a589355a46d46fdac068d9a954e741741ffe77c64e38c56ea955498c1cb04e9bce44e1cce5155333e6b76bee72347c6661bb7c78fd2fe3aad198c8fe  gvisor.tar.bz2" | sha512sum -c -
          tar xjf gvisor.tar.bz2
          sudo install -m 0755 runsc containerd-shim-runsc-v1 /usr/local/bin/
          # The release's own sidecars, so `runsc install` does not fetch them.
          sudo cp -r gvisor-bin /usr/local/bin/
          runsc --version
          sudo /usr/local/bin/runsc install --download-sidecars=NEVER
          sudo systemctl restart docker
          for i in $(seq 30); do docker info >/dev/null 2>&1 && break; sleep 1; done
          docker info --format '{{range $k, $v := .Runtimes}}{{$k}} {{end}}' | grep -w runsc

      # location/k8s's tests make a kind cluster; the sandbox image
      # carries kind and kubectl, and this says so before the tests do.
      - name: Check kind
        infrastructure: true
        run: |
          set -e
          kind version
          kubectl version --client

      # granule at a pinned commit, cloned through the git proxy the way
      # this checkout's own origin is, and the guest image the granule
      # tests boot (internal/granuletest.DefaultImage). /dev/kvm has to
      # open for this user, which `granule doctor` checks.
      - name: Install granule
        infrastructure: true
        run: |
          set -e
          origin="$(git remote get-url origin)"
          base="${origin%/${GRAIN_CI_REPO}.git}"
          base="${base%/${GRAIN_CI_REPO}}"
          git init -q /tmp/granule
          git -C /tmp/granule fetch -q --depth 1 "$base/gke-labs/granule.git" 4411ce45e5c04cea29a2fb343d7c44232bc3ac7e
          git -C /tmp/granule checkout -q FETCH_HEAD
          (cd /tmp/granule && go build -o /tmp/granule-bin/granule ./cmd/granule)
          sudo install -m 0755 /tmp/granule-bin/granule /usr/local/bin/granule
          granule doctor
          docker pull -q ghcr.io/bwsalmon/grain/guest:latest
          # What `granule granulefile build` builds VM images with, by
          # granule's own default names (journey 10's tests): its VMM
          # image, granule:latest, and its guest rootfs. The VMM half
          # has to be the pinned CLI's own, which granule's published
          # VM image for that commit carries; the rootfs is pinned by
          # digest (published from that commit) and tagged as the name
          # granule writes FROM, so a later publish does not move it.
          docker pull -q ghcr.io/gke-labs/granule/debian:4411ce45e5c04cea29a2fb343d7c44232bc3ac7e
          docker tag ghcr.io/gke-labs/granule/debian:4411ce45e5c04cea29a2fb343d7c44232bc3ac7e granule:latest
          docker pull -q ghcr.io/gke-labs/granule/debian.rootfs@sha256:5f8de1ecfb8057064198f09325102d61b277136b2186ffab8258ab1029681f4c
          docker tag ghcr.io/gke-labs/granule/debian.rootfs@sha256:5f8de1ecfb8057064198f09325102d61b277136b2186ffab8258ab1029681f4c ghcr.io/gke-labs/granule/debian.rootfs:latest

      - name: Format
        run: |
          cd v2
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: cd v2 && go build ./...

      - name: Vet
        run: cd v2 && go vet ./...

      - name: Test
        env:
          SILO_V2_REQUIRE_DOCKER: "1"
          SILO_V2_REQUIRE_RUNSC: "1"
          SILO_V2_REQUIRE_GIT: "1"
          SILO_V2_REQUIRE_GRANULE: "1"
        run: cd v2 && go test -race -timeout 20m ./...
