name: Rust
on:
  push:
    branches: [main, "grain/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Rust formatting, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
  musl:
    name: Static Linux x86-64 build smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned target
        run: rustup toolchain install 1.85.1 --profile minimal --target x86_64-unknown-linux-musl
      - run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Verify static ELF and smoke-test CLI
        shell: bash
        run: |
          set -euo pipefail
          binary=target/x86_64-unknown-linux-musl/release/silo
          readelf -l "$binary" > /tmp/silo-program-headers
          readelf -d "$binary" > /tmp/silo-dynamic-section
          if grep -q INTERP /tmp/silo-program-headers; then
            echo "Unexpected ELF interpreter"; exit 1
          fi
          if grep -q NEEDED /tmp/silo-dynamic-section; then
            echo "Unexpected dynamic dependency"; exit 1
          fi
          "$binary" validate examples/foundation.yaml --json
