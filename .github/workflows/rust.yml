name: Rust
on:
  push:
    branches: [main, "grain/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Rust formatting, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Ensure rustup is installed
        shell: bash
        run: |
          set -euo pipefail
          if command -v rustup >/dev/null 2>&1; then
            exit 0
          fi

          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          if [ ! -x "$cargo_bin/rustup" ]; then
            rustup_version="1.29.3"
            case "$(uname -m)" in
              x86_64)
                rustup_target="x86_64-unknown-linux-gnu"
                rustup_sha256="b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55"
                ;;
              aarch64)
                rustup_target="aarch64-unknown-linux-gnu"
                rustup_sha256="9f608c142e0e38a78957d0661ba1dfaf0b6fb37184cfaa4b9a0aa57af6184282"
                ;;
              *)
                echo "Unsupported architecture for rustup bootstrap: $(uname -m)" >&2
                exit 1
                ;;
            esac

            tmpdir=$(mktemp -d)
            trap 'rm -rf "$tmpdir"' EXIT

            curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL --retry 3 --retry-delay 2 \
              "https://static.rust-lang.org/rustup/archive/${rustup_version}/${rustup_target}/rustup-init" \
              -o "$tmpdir/rustup-init"
            printf '%s  %s\n' "$rustup_sha256" "$tmpdir/rustup-init" | sha256sum -c -
            chmod 0700 "$tmpdir/rustup-init"
            "$tmpdir/rustup-init" -y --no-modify-path --default-toolchain none --profile minimal
          fi

          if [ -n "${GITHUB_PATH:-}" ]; then
            printf '%s\n' "$cargo_bin" >> "$GITHUB_PATH"
          fi
      - name: Install pinned toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
  musl:
    name: Static Linux x86-64 build smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Ensure rustup is installed
        shell: bash
        run: |
          set -euo pipefail
          if command -v rustup >/dev/null 2>&1; then
            exit 0
          fi

          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          if [ ! -x "$cargo_bin/rustup" ]; then
            rustup_version="1.29.3"
            case "$(uname -m)" in
              x86_64)
                rustup_target="x86_64-unknown-linux-gnu"
                rustup_sha256="b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55"
                ;;
              aarch64)
                rustup_target="aarch64-unknown-linux-gnu"
                rustup_sha256="9f608c142e0e38a78957d0661ba1dfaf0b6fb37184cfaa4b9a0aa57af6184282"
                ;;
              *)
                echo "Unsupported architecture for rustup bootstrap: $(uname -m)" >&2
                exit 1
                ;;
            esac

            tmpdir=$(mktemp -d)
            trap 'rm -rf "$tmpdir"' EXIT

            curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL --retry 3 --retry-delay 2 \
              "https://static.rust-lang.org/rustup/archive/${rustup_version}/${rustup_target}/rustup-init" \
              -o "$tmpdir/rustup-init"
            printf '%s  %s\n' "$rustup_sha256" "$tmpdir/rustup-init" | sha256sum -c -
            chmod 0700 "$tmpdir/rustup-init"
            "$tmpdir/rustup-init" -y --no-modify-path --default-toolchain none --profile minimal
          fi

          if [ -n "${GITHUB_PATH:-}" ]; then
            printf '%s\n' "$cargo_bin" >> "$GITHUB_PATH"
          fi
      - name: Install pinned target
        run: rustup toolchain install 1.85.1 --profile minimal --target x86_64-unknown-linux-musl
      - run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Verify static ELF and smoke-test CLI
        shell: bash
        run: |
          set -euo pipefail
          binary=target/x86_64-unknown-linux-musl/release/silo
          readelf -l "$binary" > /tmp/silo-program-headers
          readelf -d "$binary" > /tmp/silo-dynamic-section
          if grep -q INTERP /tmp/silo-program-headers; then
            echo "Unexpected ELF interpreter"; exit 1
          fi
          if grep -q NEEDED /tmp/silo-dynamic-section; then
            echo "Unexpected dynamic dependency"; exit 1
          fi
          "$binary" validate examples/foundation.yaml --json
          "$binary" validate examples/job.yaml --json
          "$binary" validate examples/postgres.yaml --json
