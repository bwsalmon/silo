name: Rust
on:
  push:
    branches: [main, "grain/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Rust formatting, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Ensure rustup is installed
        shell: bash
        run: |
          set -euo pipefail
          if command -v rustup >/dev/null 2>&1; then
            exit 0
          fi

          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          if [ ! -x "$cargo_bin/rustup" ]; then
            rustup_version="1.29.3"
            case "$(uname -m)" in
              x86_64)
                rustup_target="x86_64-unknown-linux-gnu"
                rustup_sha256="b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55"
                ;;
              aarch64)
                rustup_target="aarch64-unknown-linux-gnu"
                rustup_sha256="9f608c142e0e38a78957d0661ba1dfaf0b6fb37184cfaa4b9a0aa57af6184282"
                ;;
              *)
                echo "Unsupported architecture for rustup bootstrap: $(uname -m)" >&2
                exit 1
                ;;
            esac

            tmpdir=$(mktemp -d)
            trap 'rm -rf "$tmpdir"' EXIT

            curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL --retry 3 --retry-delay 2 \
              "https://static.rust-lang.org/rustup/archive/${rustup_version}/${rustup_target}/rustup-init" \
              -o "$tmpdir/rustup-init"
            printf '%s  %s\n' "$rustup_sha256" "$tmpdir/rustup-init" | sha256sum -c -
            chmod 0700 "$tmpdir/rustup-init"
            "$tmpdir/rustup-init" -y --no-modify-path --default-toolchain none --profile minimal
          fi

          if [ -n "${GITHUB_PATH:-}" ]; then
            printf '%s\n' "$cargo_bin" >> "$GITHUB_PATH"
          fi
      - name: Install pinned toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Qualification reporting regressions (no worker qualification)
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: cargo build --locked --release
  bundle:
    name: Reproducible Linux x86-64 archive (no worker qualification)
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Bootstrap disposable builder transport
        run: apt-get update && apt-get install -y python3 ca-certificates curl git xz-utils
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install and verify integrity-pinned builder packages
        run: python3 scripts/builder.py --install
      - name: Install manifest-pinned Rust
        run: python3 scripts/bootstrap-rust.py
      - name: Build twice in independent temporary build trees
        run: |
          python3 scripts/build-bundle.py --out dist/first
          python3 scripts/build-bundle.py --out dist/second
          cmp dist/first/silo-0.1.0-linux-x86_64.tar.xz dist/second/silo-0.1.0-linux-x86_64.tar.xz
      - name: Validate the actual archive and relocated installation
        run: |
          mkdir -m 700 /tmp/silo-ci-private
          digest=$(cut -d ' ' -f 1 dist/first/SHA256SUMS)
          python3 scripts/validate-bundle.py --archive dist/first/silo-0.1.0-linux-x86_64.tar.xz --sha256 "$digest" --extract-to /tmp/silo-ci-private/install
          mv /tmp/silo-ci-private/install/silo-0.1.0-linux-x86_64 /tmp/silo-ci-private/install/relocated
          SILO_TEST_BUNDLE_ROOT=/tmp/silo-ci-private/install/relocated python3 -m unittest discover -s tests -p 'test_*.py'
      # CI artifacts only. No release event, tag, package registry, write token or signing credential.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: silo-linux-x86_64-candidate
          path: dist/first/*
          if-no-files-found: error
          retention-days: 14
