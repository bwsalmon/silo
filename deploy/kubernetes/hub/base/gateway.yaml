# Google's global external Application Load Balancer, on the static IP
# and with the Certificate Manager map terraform makes
# (deploy/terraform/hub). The cluster needs the Gateway API enabled.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: silo-hub
  annotations:
    networking.gke.io/certmap: silo-hub
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: silo-hub
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Same
---
# Only the node WebSocket goes to the backend without IAP: an exact
# match, so no other path is reachable there. Everything else is behind
# IAP. The hub checks a node token on the one and an IAP assertion on
# the rest, whichever backend a request came through.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: silo-hub
spec:
  parentRefs:
    - name: silo-hub
  hostnames:
    - hub.example.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /v1/nodes/connect
      backendRefs:
        - name: silo-hub-nodes
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: silo-hub
          port: 80
---
# The nodes' UI hosts, <node>.<SILO_HUB_NODE_UI_DOMAIN> (docs/hub.md
# §11.2): every path on them goes to the IAP backend, so the hub's IAP
# signs their viewers in. Their own route, so that the node path above
# is not reachable without IAP on them. The hub serves a node's UI on
# its host only with SILO_HUB_NODE_UI_DOMAIN set; terraform makes the
# wildcard certificate and DNS record (node_ui_domain).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: silo-hub-node-ui
spec:
  parentRefs:
    - name: silo-hub
  hostnames:
    - "*.nodes.hub.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: silo-hub
          port: 80
