# The hub's Kubernetes service account, bound through Workload Identity
# to the Google service account terraform makes (roles/cloudsql.client),
# which the Cloud SQL Auth Proxy connects as.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: silo-hub
  annotations:
    iam.gke.io/gcp-service-account: silo-hub@PROJECT.iam.gserviceaccount.com
