# The Silo hub on GKE behind IAP (docs/deploy.md). An overlay sets the
# project's values; bsalmon-gke-dev/ is the one for that project.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: silo-hub
labels:
  - pairs:
      app.kubernetes.io/name: silo-hub
    includeSelectors: false
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - pdb.yaml
  - services.yaml
  - gateway.yaml
  - policies.yaml
  - monitoring.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: silo-hub-config
    literals:
      # The IAP-enabled backend service's audience (docs/deploy.md
      # says how to read it once the Gateway has made the backend).
      - SILO_HUB_IAP_AUDIENCE=/projects/PROJECT_NUMBER/global/backendServices/BACKEND_SERVICE_ID
      # The domain each node's UI is served under, at <node>.<it>
      # (docs/deploy.md): terraform output -raw node_ui_domain. Empty
      # serves none.
      - SILO_HUB_NODE_UI_DOMAIN=
      # The issuer of the task claims the hub signs, which nodes'
      # policies name as silo_issuer: the hub's URL, https://<domain>.
      - SILO_HUB_CLAIMS_ISSUER=https://hub.example.com
      # The GitHub App ID used with SILO_HUB_GITHUB_APP_KEY_FILE to
      # fetch grainfiles from repositories (docs/deploy.md).
      - SILO_HUB_GITHUB_APP_ID=
      # Hub admins, comma-separated emails or groups.
      - SILO_HUB_ADMINS=
      # The Cloud SQL instance, PROJECT:REGION:INSTANCE.
      - CLOUD_SQL_INSTANCE=PROJECT:REGION:INSTANCE
      # The PostgreSQL role the hub serves as, its service account's
      # IAM database user: terraform output -raw runtime_role.
      - SILO_HUB_RUNTIME_ROLE=SERVICE_ACCOUNT@PROJECT.iam
