# One hub replica. A node's connection and the streams to it live on
# the one pod holding it (docs/hub.md §2.2), so the rollout is
# Recreate: the old pod says goodbye to its nodes and stops before the
# new one starts, and nodes reconnect within their backoff. The
# dispatcher runs under a database lease (§2.2.1); several replicas
# are designed in stages in §2.2 and not yet built.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: silo-hub
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: silo-hub
  template:
    metadata:
      labels:
        app: silo-hub
    spec:
      serviceAccountName: silo-hub
      # The hub's own shutdown grace (20s) and the proxy's, inside it.
      terminationGracePeriodSeconds: 40
      # Numeric, so runAsNonRoot can check it whatever USER each image
      # names (distroless's nonroot is 65532).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The Cloud SQL Auth Proxy as a native sidecar: it starts before
        # the migration and the hub and stops after the hub, so the
        # hub's shutdown can still write to the database. It listens
        # twice on the one instance (SA1-L8): on 5432 it logs the hub's
        # IAM database user in with the pod's Workload Identity, the
        # least-privileged role the hub serves as; on 5433 it takes a
        # password, for the migrate container's schema owner.
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
          restartPolicy: Always
          args:
            - --structured-logs
            - --health-check
            # Its health server must answer the kubelet's startup
            # probe on the pod's address, so it cannot be bound to
            # 127.0.0.1; networkpolicy.yaml keeps every other pod from
            # reaching it.
            - --http-address=0.0.0.0
            - --exit-zero-on-sigterm
            - $(CLOUD_SQL_INSTANCE)?port=5432&auto-iam-authn=true
            - $(CLOUD_SQL_INSTANCE)?port=5433
          env:
            - name: CLOUD_SQL_INSTANCE
              valueFrom:
                configMapKeyRef:
                  name: silo-hub-config
                  key: CLOUD_SQL_INSTANCE
          startupProbe:
            httpGet:
              path: /startup
              port: 9090
            periodSeconds: 1
            failureThreshold: 60
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        # The hub's tables, created or changed as the role that owns
        # the schema, before the hub starts; and the hub's own role
        # granted their rows and nothing more. Only this container has
        # the owner's password.
        - name: migrate
          image: silo-hub
          args: ["hub", "migrate"]
          env:
            # postgres://silo-hub:PASSWORD@127.0.0.1:5433/silo?sslmode=disable
            # (docs/deploy.md).
            - name: SILO_HUB_MIGRATE_DATABASE
              valueFrom:
                secretKeyRef:
                  name: silo-hub-db
                  key: migrate-url
            - name: SILO_HUB_RUNTIME_ROLE
              valueFrom:
                configMapKeyRef:
                  name: silo-hub-config
                  key: SILO_HUB_RUNTIME_ROLE
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: hub
          image: silo-hub
          # Metrics on a port of their own, which no Service names, so
          # the load balancer never reaches them; the PodMonitoring
          # (monitoring.yaml) scrapes the pod directly. The internal
          # listener (docs/hub.md §2.2.3) is on another, which no
          # Service names either: the hub's other pods reach it at the
          # pod's address, to open streams to the nodes this pod holds.
          args: ["hub", "serve", "-addr=:8080", "-metrics-addr=:9091", "-internal-addr=:9092"]
          envFrom:
            - configMapRef:
                name: silo-hub-config
          env:
            # postgres://silo-hub%40PROJECT.iam@127.0.0.1:5432/silo?sslmode=disable,
            # the hub's IAM database user through the proxy
            # (docs/deploy.md).
            - name: SILO_HUB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: silo-hub-db
                  key: url
            # The migrate init container made the tables; this role may
            # only read and write their rows (as may `silo hub team` and
            # `silo hub token`, exec'd here).
            - name: SILO_HUB_MIGRATE
              value: "false"
            # The key the hub's pods share for their internal listeners
            # (docs/deploy.md).
            - name: SILO_HUB_INTERNAL_KEY_FILE
              value: /var/run/secrets/silo-hub-internal/key
          volumeMounts:
            - name: internal-key
              mountPath: /var/run/secrets/silo-hub-internal
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9091
            - name: internal
              containerPort: 9092
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: internal-key
          secret:
            secretName: silo-hub-internal
