# Two hub replicas (docs/hub.md §2.2.5). Any pod serves any request: a
# node's connection lives on one pod, the registry naming it is shared
# through the database, and streams and events to the node are
# forwarded to that pod over the internal listener. The rollout starts
# a new pod before it stops an old one, and never has fewer ready than
# the replicas: each old pod says goodbye to its nodes, which reconnect
# to a ready pod, and the dispatcher's lease (§2.2.1) moves to another
# pod within seconds. The PodDisruptionBudget (pdb.yaml) keeps a pod
# serving through node upgrades and drains.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: silo-hub
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: silo-hub
  template:
    metadata:
      labels:
        app: silo-hub
    spec:
      serviceAccountName: silo-hub
      # The pods on different zones where the cluster has them, and on
      # different GKE nodes always, so one node's or one zone's loss
      # leaves a pod serving. A zonal cluster has one zone, and
      # ScheduleAnyway lets it schedule anyway.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: silo-hub
          matchLabelKeys:
            - pod-template-hash
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: silo-hub
          matchLabelKeys:
            - pod-template-hash
      # The hub's own shutdown grace (20s) and the proxy's, inside it.
      terminationGracePeriodSeconds: 40
      # Numeric, so runAsNonRoot can check it whatever USER each image
      # names (distroless's nonroot is 65532).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The Cloud SQL Auth Proxy as a native sidecar: it starts before
        # the migration and the hub and stops after the hub, so the
        # hub's shutdown can still write to the database. It listens
        # twice on the one instance (SA1-L8): on 5432 it logs the hub's
        # IAM database user in with the pod's Workload Identity, the
        # least-privileged role the hub serves as; on 5433 it takes a
        # password, for the migrate container's schema owner.
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
          restartPolicy: Always
          args:
            - --structured-logs
            - --health-check
            # Its health server must answer the kubelet's startup
            # probe on the pod's address, so it cannot be bound to
            # 127.0.0.1; networkpolicy.yaml keeps every other pod from
            # reaching it.
            - --http-address=0.0.0.0
            - --exit-zero-on-sigterm
            - $(CLOUD_SQL_INSTANCE)?port=5432&auto-iam-authn=true
            - $(CLOUD_SQL_INSTANCE)?port=5433
          env:
            - name: CLOUD_SQL_INSTANCE
              valueFrom:
                configMapKeyRef:
                  name: silo-hub-config
                  key: CLOUD_SQL_INSTANCE
          startupProbe:
            httpGet:
              path: /startup
              port: 9090
            periodSeconds: 1
            failureThreshold: 60
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        # The hub's tables, created or changed as the role that owns
        # the schema, before the hub starts; and the hub's own role
        # granted their rows and nothing more. Only this container has
        # the owner's password.
        - name: migrate
          image: silo-hub
          args: ["hub", "migrate"]
          env:
            # postgres://silo-hub:PASSWORD@127.0.0.1:5433/silo?sslmode=disable
            # (docs/deploy.md).
            - name: SILO_HUB_MIGRATE_DATABASE
              valueFrom:
                secretKeyRef:
                  name: silo-hub-db
                  key: migrate-url
            - name: SILO_HUB_RUNTIME_ROLE
              valueFrom:
                configMapKeyRef:
                  name: silo-hub-config
                  key: SILO_HUB_RUNTIME_ROLE
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: hub
          image: silo-hub
          # Metrics on a port of their own, which no Service names, so
          # the load balancer never reaches them; the PodMonitoring
          # (monitoring.yaml) scrapes the pod directly. The internal
          # listener (docs/hub.md §2.2.3) is on another, which no
          # Service names either: the hub's other pods reach it at the
          # pod's address, to open streams to the nodes this pod holds.
          args: ["hub", "serve", "-addr=:8080", "-metrics-addr=:9091", "-internal-addr=:9092"]
          envFrom:
            - configMapRef:
                name: silo-hub-config
          env:
            # postgres://silo-hub%40PROJECT.iam@127.0.0.1:5432/silo?sslmode=disable,
            # the hub's IAM database user through the proxy, which
            # carries it to Cloud SQL over TLS (docs/deploy.md). Always
            # PostgreSQL: the hub refuses SQLite on Kubernetes.
            - name: SILO_HUB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: silo-hub-db
                  key: url
            # The migrate init container made the tables; this role may
            # only read and write their rows (as may `silo hub team` and
            # `silo hub token`, exec'd here).
            - name: SILO_HUB_MIGRATE
              value: "false"
            # The key the hub's pods share for their internal listeners
            # (docs/deploy.md).
            - name: SILO_HUB_INTERNAL_KEY_FILE
              value: /var/run/secrets/silo-hub-internal/key
            # The key the hub signs task claims with (docs/hub.md
            # §6.4, docs/deploy.md). Its issuer is
            # SILO_HUB_CLAIMS_ISSUER, from the config map.
            - name: SILO_HUB_CLAIMS_KEY_FILE
              value: /var/run/secrets/silo-hub-claims/key
            # The GitHub webhook HMAC secret and GitHub App private key
            # (docs/deploy.md). The hub refuses to start on Kubernetes
            # without a webhook secret (server.CheckWebhookSecret).
            - name: SILO_HUB_WEBHOOK_SECRET_FILE
              value: /var/run/secrets/silo-hub-github/webhook-secret
            - name: SILO_HUB_GITHUB_APP_KEY_FILE
              value: /var/run/secrets/silo-hub-github/app-key
            # This pod's name in the shared registry, and the address
            # the hub's other pods reach its internal listener at
            # (docs/hub.md §2.2.2), from the downward API.
            - name: SILO_HUB_POD
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SILO_HUB_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SILO_HUB_POD_ADDR
              value: $(SILO_HUB_POD_IP):9092
          volumeMounts:
            - name: internal-key
              mountPath: /var/run/secrets/silo-hub-internal
              readOnly: true
            - name: claims-key
              mountPath: /var/run/secrets/silo-hub-claims
              readOnly: true
            - name: github
              mountPath: /var/run/secrets/silo-hub-github
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9091
            - name: internal
              containerPort: 9092
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: internal-key
          secret:
            secretName: silo-hub-internal
        - name: claims-key
          secret:
            secretName: silo-hub-claims
        - name: github
          secret:
            secretName: silo-hub-github
