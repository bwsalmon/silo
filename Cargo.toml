[package]
name = "silo"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Authenticated policy and control foundation for Silo"
license = "Apache-2.0"
publish = false

[dependencies]
hmac = "=0.12.1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
tempfile = "=3.19.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
