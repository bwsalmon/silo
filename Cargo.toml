[package]
name = "silo"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Authenticated rootless OCI jobs with a fail-closed Bubblewrap runner"
license = "Apache-2.0"
publish = false

[dependencies]
flate2 = "1"
futures = "=0.3.34"
hmac = "=0.12.1"
libc = "0.2"
rmcp = { version = "=0.8.5", default-features = false, features = ["base64", "macros", "server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "=1.50.0", features = ["rt", "io-util", "io-std", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["codec"] }
zeroize = "1"

[dev-dependencies]
rmcp = { version = "=0.8.5", features = ["client", "transport-child-process"] }
tempfile = "=3.19.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
